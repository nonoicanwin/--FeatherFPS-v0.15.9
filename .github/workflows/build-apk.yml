
name: Build FeatherFPS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

          PROJECT_DIR="$(find source -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;

          if ! compgen -G "$GITHUB_WORKSPACE/artifacts/*.apk" > /dev/null; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeatherFPS-APK
          path: artifacts/*.apk
          if-no-files-found: error
          
