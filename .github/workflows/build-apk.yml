
name: Build FeatherFPS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: No ZIP file found in the repository root."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

          GRADLEW="$(find source -type f -name gradlew -print -quit)"

          if [[ -z "$GRADLEW" ]]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;

          if ! compgen -G "$GITHUB_WORKSPACE/artifacts/*.apk" > /dev/null; then
            echo "ERROR: Build finished but no APK was found."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeatherFPS-APK
          path: artifacts/*.apk
          if-no-files-found: error
          
